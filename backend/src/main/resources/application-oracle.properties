spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:smarttripdb_high}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.data-source-properties.[oracle.net.tns_admin]=${ORACLE_WALLET_PATH}

smarttrip.places.geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
smarttrip.places.geoapify.api-key=${GEOAPIFY_API_KEY:}
smarttrip.places.geoapify.connect-timeout-ms=${GEOAPIFY_CONNECT_TIMEOUT_MS:3000}
smarttrip.places.geoapify.read-timeout-ms=${GEOAPIFY_READ_TIMEOUT_MS:10000}

smarttrip.places.overpass-url=${SMARTTRIP_OVERPASS_URL:https://overpass-api.de/api/interpreter}
smarttrip.places.overpass-alternates=${SMARTTRIP_OVERPASS_ALTERNATES:https://overpass.private.coffee/api/interpreter}
smarttrip.places.connect-timeout-ms=${SMARTTRIP_PLACES_CONNECT_TIMEOUT_MS:3000}
smarttrip.places.read-timeout-ms=${SMARTTRIP_PLACES_READ_TIMEOUT_MS:15000}
smarttrip.places.endpoint-cooldown-seconds=${SMARTTRIP_OVERPASS_ENDPOINT_COOLDOWN_SECONDS:180}
smarttrip.places.daily-overpass-request-limit=${SMARTTRIP_OVERPASS_DAILY_REQUEST_LIMIT:80}
smarttrip.places.wikidata.enabled=${SMARTTRIP_WIKIDATA_ENABLED:true}
smarttrip.places.wikidata.connect-timeout-ms=${SMARTTRIP_WIKIDATA_CONNECT_TIMEOUT_MS:3000}
smarttrip.places.wikidata.read-timeout-ms=${SMARTTRIP_WIKIDATA_READ_TIMEOUT_MS:10000}
smarttrip.places.wikipedia.enabled=${SMARTTRIP_WIKIPEDIA_ENABLED:true}
smarttrip.places.wikipedia.connect-timeout-ms=${SMARTTRIP_WIKIPEDIA_CONNECT_TIMEOUT_MS:3000}
smarttrip.places.wikipedia.read-timeout-ms=${SMARTTRIP_WIKIPEDIA_READ_TIMEOUT_MS:8000}
smarttrip.recommendations.diagnostics=${SMARTTRIP_RECOMMENDATION_DIAGNOSTICS:false}
smarttrip.flights.duffel.base-url=${DUFFEL_API_BASE_URL:https://api.duffel.com}
smarttrip.flights.duffel.access-token=${DUFFEL_ACCESS_TOKEN:}
smarttrip.routes.ors.base-url=${ORS_BASE_URL:https://api.heigit.org}
smarttrip.routes.ors.api-key=${ORS_API_KEY:}
smarttrip.routes.ors.connect-timeout-ms=${ORS_CONNECT_TIMEOUT_MS:3000}
smarttrip.routes.ors.read-timeout-ms=${ORS_READ_TIMEOUT_MS:12000}

smarttrip.jwt.secret=${SMARTTRIP_JWT_SECRET}
smarttrip.cors.allowed-origins=${SMARTTRIP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
smarttrip.package-persistence.enabled=${SMARTTRIP_PACKAGE_PERSISTENCE_ENABLED:false}
