spring.application.name=Back_end_proyecto
spring.docker.compose.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/smarttrip;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.h2.Driver}}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
