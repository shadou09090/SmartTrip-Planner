spring.application.name=Back_end_proyecto
spring.docker.compose.enabled=false

# conexion a mysql, se puede cambiar con variables de entorno
# los valores por defecto coinciden con compose.yaml (solo para desarrollo local)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydatabase}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update

# origenes del frontend permitidos por cors, separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
